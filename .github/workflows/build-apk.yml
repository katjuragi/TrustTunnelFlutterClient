name: Build APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify package access
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: |
          if [ -z "$GPR_KEY" ]; then
            echo "::error::Repository secret GPR_KEY is required to download TrustTunnelClient from GitHub Packages."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: make ln

      - name: Generate Code
        run: make gen

      - name: Build APK
        env:
          GPR_KEY: ${{ secrets.GPR_KEY }}
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trusttunnel-1.2.1-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
